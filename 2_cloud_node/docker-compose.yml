version: '3.8'
services:
  minio:
    image: minio/minio:latest
    container_name: minio_datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_mlops
      MINIO_ROOT_PASSWORD: MLOpsPassword2026! 
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
